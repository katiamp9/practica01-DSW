name: Cypress E2E

on:
  workflow_run:
    workflows: ["SonarCloud Analysis"]
    types: [completed]

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: ./frontend-empleados

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-empleados/package-lock.json

      - name: Ejecutar Cypress login E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend-empleados
          install: true
          start: npm start -- --host 0.0.0.0 --port 4200
          wait-on: 'http://localhost:4200/login'
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/login-darkmode.cy.ts
        env:
          CYPRESS_baseUrl: http://localhost:4200
